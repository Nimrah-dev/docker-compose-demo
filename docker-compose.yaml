services:
  app:
    build: .
    ports:
        - "5000:5000"
    environment:
         DB_HOST: db
         REDIS_HOST: cache
    depends_on:
      - db
      - cache   
    
  db:
     image: postgres:16     
     environment:
           POSTGRES_PASSWORD: ${DB_PASSWORD}
     volumes:
      - db-data:/var/lib/postgresql/data
  cache:
     image: redis    
    
volumes:
       db-data:  
